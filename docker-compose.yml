version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medcode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medcode_user
      POSTGRES_PASSWORD: medcode_secure_pass_2026
      POSTGRES_DB: medcode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcode_user -d medcode_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medcode-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://medcode_user:medcode_secure_pass_2026@postgres:5432/medcode_db
      - JWT_SECRET_KEY=medcode_prod_jwt_secret_key_change_in_production_2026
      - AI_MODE=demo
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medcode-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
